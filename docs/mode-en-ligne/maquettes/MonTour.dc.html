<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Partie en ligne — mon tour</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chivo:wght@400;600;700;900&amp;family=Chivo+Mono:wght@600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#FFEBD2}a:hover{color:#FFF7EE}
.lbl{font-family:'Chivo Mono',monospace;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,247,238,.7)}
.die{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);width:50px;height:50px;padding:6px;box-sizing:border-box;background:#fff;border:2px solid #333;border-radius:12px;box-shadow:2px 2px 4px rgba(0,0,0,.25);flex:none}
.die .dot{width:10px;height:10px;background:#333;border-radius:50%;align-self:center;justify-self:center}
.die img{grid-column:1/4;grid-row:1/4;width:100%;height:100%;object-fit:contain}
.die--sm{width:38px;height:38px;padding:5px;border-radius:10px;border-width:1.5px}
.die--sm .dot{width:7px;height:7px}
.die--xs{width:22px;height:22px;padding:3px;border-radius:6px;border-width:1.5px;box-shadow:none}
.die--xs .dot{width:4px;height:4px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:56px;padding:14px 16px;border:0;border-radius:14px;font-family:'Chivo',sans-serif;font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase;line-height:1;cursor:pointer;box-sizing:border-box}
.btn--primary{background:#FFF4E4;color:#7A3410;box-shadow:0 5px 0 rgba(0,0,0,.3)}
.btn--danger{background:rgba(255,217,194,.14);border:1.5px solid rgba(255,217,194,.6);color:#FFD9C2}
.btn--jade{background:rgba(191,240,214,.14);border:1.5px solid rgba(191,240,214,.6);color:#BFF0D6}
.row{display:flex;align-items:center;gap:10px;min-height:44px;padding:0 12px;background:rgba(52,18,8,.42);border:1px solid rgba(255,247,238,.16);border-radius:12px;box-sizing:border-box}
.row--active{background:rgba(255,212,143,.14);border-color:rgba(255,212,143,.75);box-shadow:0 0 0 1px rgba(255,212,143,.42)}
.pos{display:flex;align-items:center;justify-content:center;flex:none;width:26px;height:26px;border-radius:50%;background:rgba(255,247,238,.14);border:1px solid rgba(255,247,238,.24);font-family:'Chivo Mono',monospace;font-size:13px;font-weight:600;color:#FFF7EE;box-sizing:border-box}
.pos--active{background:#FFD48F;border-color:#FFD48F;color:#5A2208}
.cnt{display:flex;align-items:center;gap:5px;flex:none;padding:4px 9px;border-radius:999px;background:rgba(255,247,238,.1);border:1px solid rgba(255,247,238,.16);font-family:'Chivo Mono',monospace;font-size:12px;font-weight:600;color:#FFF7EE;white-space:nowrap}
.mini{width:10px;height:10px;border-radius:3px;background:rgba(255,255,255,.35);border:1px solid rgba(255,247,238,.5);box-sizing:border-box}
.chip{padding:2px 8px;border-radius:999px;background:rgba(255,247,238,.14);font-family:'Chivo Mono',monospace;font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#FFF7EE}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: linear-gradient(160deg, #B85F14 0%, #A2431D 55%, #7E2A16 100%); color: #FFF7EE; font-family: 'Chivo', Roboto, sans-serif; font-size: 14px; overflow: hidden">

  <header style="flex: none; padding: 24px 20px 14px">
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
      <h1 style="margin: 0; font-weight: 900; font-size: 26px; letter-spacing: -0.03em">Partie en ligne</h1>
      <div style="display: flex; align-items: center; gap: 8px">
        <div style="display: flex; align-items: baseline; gap: 4px; padding: 6px 12px; background: rgba(48,17,7,.42); border: 1px solid rgba(255,247,238,.12); border-radius: 999px">
          <span style="font-family: 'Chivo Mono', monospace; font-size: 18px; font-weight: 600; color: #FFEBD2">25</span>
          <span class="lbl" style="font-size: 10px">dés</span>
        </div>
        <button type="button" aria-label="Menu" style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; padding: 0; background: rgba(48,17,7,.42); border: 1px solid rgba(255,247,238,.12); border-radius: 50%; color: #FFF7EE">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg>
        </button>
      </div>
    </div>
    <div style="margin-top: 8px; font-size: 15px; font-weight: 700; color: #FFD48F">À toi de jouer !</div>
  </header>

  <div style="display: flex; flex: 1; flex-direction: column; gap: 8px; min-height: 0; padding: 4px 20px 14px; overflow: hidden">
    
    <sc-for list="{{players}}" as="pl" hint-placeholder-count="5">
      <div class="{{pl.rowCls}}">
        <span class="{{pl.posCls}}">{{pl.pos}}</span>
        <span style="font-weight: 600; font-size: 15px; white-space: nowrap">{{pl.label}}</span>
        <sc-if value="{{pl.isMe}}" hint-placeholder-val="{{false}}"><span class="chip">Toi</span></sc-if>
        <div style="display: flex; align-items: center; gap: 10px; margin-left: auto">
          <sc-if value="{{pl.hasBet}}" hint-placeholder-val="{{false}}">
            <div style="display: flex; align-items: center; gap: 5px">
              <span style="font-family: 'Chivo Mono', monospace; font-size: 14px; font-weight: 600; color: #FFEBD2">{{pl.betQty}} ×</span>
              <div class="die die--xs"><sc-for list="{{pl.betDie.dots}}" as="p" hint-placeholder-count="4"><span class="dot" style="grid-column: {{p.c}}; grid-row: {{p.r}}"></span></sc-for></div>
            </div>
          </sc-if>
          <span class="cnt" aria-label="{{pl.n}} dés restants"><span class="mini"></span>{{pl.n}} dés</span>
        </div>
      </div>
    </sc-for>
  </div>

  <div style="flex: none; display: flex; flex-direction: column; gap: 12px; padding: 16px 20px 22px; background: rgba(48,17,7,.66); border-top: 1px solid rgba(255,212,143,.42); border-radius: 22px 22px 0 0; box-shadow: 0 -8px 24px rgba(0,0,0,.5)">

    <div style="display: flex; align-items: center; gap: 14px; padding: 12px 14px; background: rgba(255,244,228,.1); border: 1px solid rgba(255,244,228,.42); border-radius: 14px">
      <div style="display: flex; flex: 1; flex-direction: column; gap: 4px; min-width: 0">
        <span class="lbl">Mise à battre</span>
        <span style="display: flex; align-items: center; gap: 6px; font-size: 14px; color: rgba(255,247,238,.88)"><span class="pos" style="width: 20px; height: 20px; font-size: 11px">2</span>🐙 Hugo</span>
      </div>
      <div style="display: flex; align-items: center; gap: 10px">
        <span style="font-family: 'Chivo Mono', monospace; font-size: 30px; font-weight: 600; color: #FFEBD2">4 ×</span>
        <div class="die die--sm"><span class="dot" style="grid-column: 1; grid-row: 1"></span><span class="dot" style="grid-column: 1; grid-row: 3"></span><span class="dot" style="grid-column: 3; grid-row: 1"></span><span class="dot" style="grid-column: 3; grid-row: 3"></span><span class="dot" style="grid-column: 2; grid-row: 2"></span></div>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px; padding: 12px; background: rgba(52,18,8,.42); border: 1px solid rgba(255,247,238,.16); border-radius: 14px">
      <span style="font-weight: 600; font-size: 15px; color: rgba(255,247,238,.75)">Tes dés</span>
      <div style="display: flex; gap: 8px">
        <sc-for list="{{myDice}}" as="d" hint-placeholder-count="5">
          <div class="die">
            <sc-if value="{{d.toucan}}" hint-placeholder-val="{{false}}"><img src="/_blob/53de4a61186bdc1cc54ce90ba4805839" alt="Perudo"></sc-if>
            <sc-for list="{{d.dots}}" as="p" hint-placeholder-count="4"><span class="dot" style="grid-column: {{p.c}}; grid-row: {{p.r}}"></span></sc-for>
          </div>
        </sc-for>
      </div>
    </div>

    <button type="button" class="btn btn--primary">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"></path></svg>
      Parier
    </button>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
      <button type="button" class="btn btn--danger">Menteur !</button>
      <button type="button" class="btn btn--jade">Chiffre exact</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  die(n) {
    const P = { 1: [], 2: [[1,1],[3,3]], 3: [[1,1],[2,2],[3,3]], 4: [[1,1],[1,3],[3,1],[3,3]], 5: [[1,1],[1,3],[3,1],[3,3],[2,2]], 6: [[1,1],[1,2],[1,3],[3,1],[3,2],[3,3]] };
    return { toucan: n === 1, dots: (P[n] || []).map(function (x) { return { c: x[0], r: x[1] }; }) };
  }
  renderVals() {
    const raw = [
      { pos: 1, label: '🐸 Léa', qty: 3, face: 4 },
      { pos: 2, label: '🐙 Hugo', qty: 4, face: 5 },
      { pos: 3, label: '🦊 Math', me: true },
      { pos: 4, label: '🌮 Inès' },
      { pos: 5, label: '🤠 Karim' },
    ];
    const players = raw.map((p) => ({
      pos: p.pos,
      label: p.label,
      isMe: !!p.me,
      n: 5,
      hasBet: !!p.qty,
      noBet: !p.qty,
      betQty: p.qty,
      betDie: this.die(p.face || 2),
      rowCls: 'row' + (p.me ? ' row--active' : ''),
      posCls: 'pos' + (p.me ? ' pos--active' : ''),
    }));
    return { players: players, myDice: [4, 4, 2, 6, 3].map((n) => this.die(n)) };
  }
}
</script>
</body>
</html>
