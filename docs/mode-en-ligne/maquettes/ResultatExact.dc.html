<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Fin du tour — chiffre exact raté</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chivo:wght@400;600;700;900&amp;family=Chivo+Mono:wght@600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#FFEBD2}a:hover{color:#FFF7EE}
.lbl{font-family:'Chivo Mono',monospace;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,247,238,.7)}
.die{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);width:50px;height:50px;padding:6px;box-sizing:border-box;background:#fff;border:2px solid #333;border-radius:12px;box-shadow:2px 2px 4px rgba(0,0,0,.25);flex:none}
.die .dot{width:10px;height:10px;background:#333;border-radius:50%;align-self:center;justify-self:center}
.die img{grid-column:1/4;grid-row:1/4;width:100%;height:100%;object-fit:contain}
.die--sm{width:34px;height:34px;padding:4px;border-radius:9px;border-width:1.5px}
.die--sm .dot{width:6px;height:6px}
.die--xs{width:22px;height:22px;padding:3px;border-radius:6px;border-width:1.5px;box-shadow:none}
.die--xs .dot{width:4px;height:4px}
.die--hl{outline:2px solid #FFD48F;outline-offset:1px}
.die--dim{opacity:.4}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:56px;padding:14px 16px;border:0;border-radius:14px;font-family:'Chivo',sans-serif;font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase;line-height:1;cursor:pointer;box-sizing:border-box}
.btn--primary{background:#FFF4E4;color:#7A3410;box-shadow:0 5px 0 rgba(0,0,0,.3)}
.verdict{display:flex;flex-direction:column;gap:10px;padding:16px;border-radius:16px}
.verdict--win{background:rgba(191,240,214,.14);border:1.5px solid rgba(191,240,214,.6)}
.verdict--lose{background:rgba(255,217,194,.14);border:1.5px solid rgba(255,217,194,.6)}
.vicon{display:flex;align-items:center;justify-content:center;flex:none;width:40px;height:40px;border-radius:50%}
.vicon--win{background:#BFF0D6;color:#174B33}
.vicon--lose{background:#FFD9C2;color:#6B2412}
.row{display:flex;align-items:center;gap:10px;min-height:44px;padding:0 12px;background:rgba(52,18,8,.42);border:1px solid rgba(255,247,238,.16);border-radius:12px;box-sizing:border-box}
.row--loser{border-color:rgba(255,217,194,.6);background:rgba(255,217,194,.1)}
.pos{display:flex;align-items:center;justify-content:center;flex:none;width:26px;height:26px;border-radius:50%;background:rgba(255,247,238,.14);border:1px solid rgba(255,247,238,.24);font-family:'Chivo Mono',monospace;font-size:13px;font-weight:600;color:#FFF7EE;box-sizing:border-box}
.minus{padding:2px 7px;border-radius:999px;background:#FFD9C2;font-family:'Chivo Mono',monospace;font-size:11px;font-weight:600;color:#6B2412}
.cnt{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0;border-radius:10px}
.cnt--hl{background:rgba(255,212,143,.18);box-shadow:inset 0 0 0 1px rgba(255,212,143,.6)}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: linear-gradient(160deg, #B85F14 0%, #A2431D 55%, #7E2A16 100%); color: #FFF7EE; font-family: 'Chivo', Roboto, sans-serif; font-size: 14px; overflow: hidden">

  <header style="flex: none; padding: 24px 20px 12px">
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
      <h1 style="margin: 0; font-weight: 900; font-size: 26px; letter-spacing: -0.03em">Fin du tour</h1>
      <div style="display: flex; align-items: center; gap: 8px">
        <div style="display: flex; align-items: baseline; gap: 4px; padding: 6px 12px; background: rgba(48,17,7,.42); border: 1px solid rgba(255,247,238,.12); border-radius: 999px">
          <span style="font-family: 'Chivo Mono', monospace; font-size: 18px; font-weight: 600; color: #FFEBD2">25</span>
          <span class="lbl" style="font-size: 10px">dés</span>
        </div>
        <button type="button" aria-label="Menu" style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; padding: 0; background: rgba(48,17,7,.42); border: 1px solid rgba(255,247,238,.12); border-radius: 50%; color: #FFF7EE">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg>
        </button>
      </div>
    </div>
    <div style="margin-top: 8px; font-size: 14px; color: rgba(255,247,238,.8)">{{intro}}</div>
  </header>

  <div style="display: flex; flex: 1; flex-direction: column; gap: 14px; min-height: 0; padding: 4px 20px 14px; overflow: hidden">

    <div class="{{verdictCls}}">
      <div style="display: flex; align-items: center; gap: 12px">
        <div class="{{iconCls}}">
          <sc-if value="{{won}}" hint-placeholder-val="{{true}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></sc-if>
          <sc-if value="{{lost}}" hint-placeholder-val="{{false}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></sc-if>
        </div>
        <div style="display: flex; flex-direction: column; gap: 2px">
          <span style="font-weight: 900; font-size: 22px; letter-spacing: -0.02em">{{title}}</span>
          <span style="font-size: 13px; color: rgba(255,247,238,.85)">{{subtitle}}</span>
        </div>
      </div>
      <div style="display: flex; align-items: center; gap: 8px; padding-top: 10px; border-top: 1px solid rgba(255,247,238,.16)">
        <span class="lbl">Mise</span>
        <span style="font-family: 'Chivo Mono', monospace; font-size: 16px; font-weight: 600">4 ×</span>
        <div class="die die--xs"><span class="dot" style="grid-column: 1; grid-row: 1"></span><span class="dot" style="grid-column: 1; grid-row: 3"></span><span class="dot" style="grid-column: 3; grid-row: 1"></span><span class="dot" style="grid-column: 3; grid-row: 3"></span><span class="dot" style="grid-column: 2; grid-row: 2"></span></div>
        <span class="lbl" style="margin-left: auto">Sur la table</span>
        <span style="font-family: 'Chivo Mono', monospace; font-size: 16px; font-weight: 600; color: #FFD48F">3</span>
      </div>
      
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <span class="lbl">Résultat du tour</span>
      <div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 4px">
        <sc-for list="{{counts}}" as="c" hint-placeholder-count="6">
          <div class="{{c.cls}}">
            <div class="die die--sm">
              <sc-if value="{{c.d.toucan}}" hint-placeholder-val="{{false}}"><img src="/_blob/53de4a61186bdc1cc54ce90ba4805839" alt="Perudo"></sc-if>
              <sc-for list="{{c.d.dots}}" as="p" hint-placeholder-count="4"><span class="dot" style="grid-column: {{p.c}}; grid-row: {{p.r}}"></span></sc-for>
            </div>
            <span style="font-family: 'Chivo Mono', monospace; font-size: 13px; font-weight: 600">×{{c.n}}</span>
          </div>
        </sc-for>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px">
      <sc-for list="{{players}}" as="pl" hint-placeholder-count="5">
        <div class="{{pl.rowCls}}">
          <span class="pos">{{pl.pos}}</span>
          <span style="font-weight: 600; font-size: 14px; white-space: nowrap">{{pl.label}}</span>
          <sc-if value="{{pl.loser}}" hint-placeholder-val="{{false}}"><span class="minus">−1 dé</span></sc-if>
          <div style="display: flex; gap: 4px; margin-left: auto">
            <sc-for list="{{pl.dice}}" as="d" hint-placeholder-count="5">
              <div class="{{d.cls}}">
                <sc-if value="{{d.toucan}}" hint-placeholder-val="{{false}}"><img src="/_blob/53de4a61186bdc1cc54ce90ba4805839" alt="Perudo"></sc-if>
                <sc-for list="{{d.dots}}" as="p" hint-placeholder-count="4"><span class="dot" style="grid-column: {{p.c}}; grid-row: {{p.r}}"></span></sc-for>
              </div>
            </sc-for>
          </div>
        </div>
      </sc-for>
    </div>
  </div>

  <div style="flex: none; display: flex; flex-direction: column; gap: 10px; padding: 14px 20px 22px; background: rgba(48,17,7,.58); border-top: 1px solid rgba(255,247,238,.12); box-shadow: 0 -6px 20px rgba(0,0,0,.5)">
    <span style="font-size: 13px; text-align: center; color: rgba(255,247,238,.8)">{{next}}</span>
    <button type="button" class="btn btn--primary">
      Tour suivant
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
    </button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"scenario":{"editor":"enum","options":["menteur","exact"],"default":"exact"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  die(n, cls) {
    const P = { 1: [], 2: [[1,1],[3,3]], 3: [[1,1],[2,2],[3,3]], 4: [[1,1],[1,3],[3,1],[3,3]], 5: [[1,1],[1,3],[3,1],[3,3],[2,2]], 6: [[1,1],[1,2],[1,3],[3,1],[3,2],[3,3]] };
    return { toucan: n === 1, cls: 'die ' + (cls || ''), dots: (P[n] || []).map(function (x) { return { c: x[0], r: x[1] }; }) };
  }
  renderVals() {
    const exact = (this.props.scenario ?? 'exact') === 'exact';
    const raw = [
      { pos: 1, label: '🐸 Léa', dice: [2, 4, 4, 6, 3] },
      { pos: 2, label: '🐙 Hugo', dice: [5, 1, 3, 6, 2], loser: !exact },
      { pos: 3, label: '🦊 Toi', dice: [4, 4, 2, 6, 3], loser: exact },
      { pos: 4, label: '🌮 Inès', dice: [5, 2, 6, 6, 3] },
      { pos: 5, label: '🤠 Karim', dice: [3, 4, 2, 6, 4] },
    ];
    const players = raw.map((p) => ({
      pos: p.pos,
      label: p.label,
      loser: !!p.loser,
      rowCls: 'row' + (p.loser ? ' row--loser' : ''),
      dice: p.dice.map((n) => this.die(n, 'die--xs ' + ((n === 5 || n === 1) ? 'die--hl' : 'die--dim'))),
    }));
    const tally = { 1: 1, 2: 5, 3: 5, 4: 6, 5: 2, 6: 6 };
    const counts = [1, 2, 3, 4, 5, 6].map((n) => ({
      d: this.die(n),
      n: tally[n],
      cls: 'cnt' + ((n === 5 || n === 1) ? ' cnt--hl' : ''),
    }));
    return {
      won: !exact,
      lost: exact,
      verdictCls: 'verdict ' + (exact ? 'verdict--lose' : 'verdict--win'),
      iconCls: 'vicon ' + (exact ? 'vicon--lose' : 'vicon--win'),
      intro: exact ? 'Tu as annoncé « Chiffre exact » sur la mise de Hugo' : 'Tu as crié « Menteur ! » sur la mise de Hugo',
      title: exact ? 'Raté, pas exact' : 'Gagné, Hugo bluffait !',
      subtitle: exact ? 'Il y en avait 3, pas 4. Tu perds un dé.' : 'Il n\'y en avait que 3. Hugo perd un dé.',
      next: exact ? 'Tu commences le prochain tour' : '🐙 Hugo commence le prochain tour',
      counts: counts,
      players: players,
    };
  }
}
</script>
</body>
</html>
