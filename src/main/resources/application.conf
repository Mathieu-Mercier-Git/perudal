# Project configuration
# For usage and syntax, see https://github.com/typesafehub/config
#
# The values below are the DEVELOPMENT defaults. They are packaged inside the jar,
# so they must never contain a production secret.
# In production, every key marked with ${?ENV_VAR} can be overridden by an environment
# variable, without rebuilding the application. Two other override mechanisms are available:
#   - a system property: -Dinternal-api.auth-password=...
#   - a full external file: -Dconfig.file=/etc/perudal/application.conf

hello=A configuration value

# API documentation and monitoring configuration (HTTP Basic authentication)
# The endpoints protected by these credentials are /api/swagger and /api/monitoring/*
# PERUDAL_INTERNAL_API_PASSWORD *must* be set in production
internal-api.auth-username = "internal-api"
internal-api.auth-username = ${?PERUDAL_INTERNAL_API_USERNAME}
internal-api.auth-password = "dev-only-password-change-me"
internal-api.auth-password = ${?PERUDAL_INTERNAL_API_PASSWORD}

# The number of worker thread pool available
# For an application using only non-blocking code, the value "null" will optimize the pool size according to the CPU used
# For an application using blocking code (this is generally the case), increasing this number might help getting better throughput and help avoiding to freeze the application once all the threads are exhausted
# Note that limiting this number can also be a good idea if the HTTP endpoints are intensively using some resources like the CPU
http-grizzly.worker-threads-pool-size = 512
http-grizzly.worker-threads-pool-size = ${?PERUDAL_HTTP_WORKER_THREADS}

# Database configuration
#
# DISABLED: the project does not use any database yet, the game state is kept in memory
# (see the commented modules in jar.guice.ApplicationModule and jar.WebApplication).
# No connection is opened at startup, so no database server is required to run the application.
# Uncomment this block at the same time as the Guice modules when a database is actually needed.
#
# for hikari config, quotes are required for sub-keys
# dialects values in: MYSQL, H2, ORACLE, POSTGRE, SQL_SERVEUR
# db.dialect="MYSQL"
# database connection parameters, for datasource class, see https://github.com/brettwooldridge/HikariCP#popular-datasource-class-names
# db.hikari.driverClassName="com.mysql.cj.jdbc.Driver"
# db.hikari.jdbcUrl="jdbc:mysql://localhost:8889/perudal"
# db.hikari.jdbcUrl=${?PERUDAL_DB_URL}
# db.hikari."dataSource.user"=root
# db.hikari."dataSource.user"=${?PERUDAL_DB_USER}
# db.hikari."dataSource.password"=root
# db.hikari."dataSource.password"=${?PERUDAL_DB_PASSWORD}
# connection pool configuration
